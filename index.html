<style>

  html,body{height:100%;overflow:hidden;background:#241f3a;font-family:"Noto Serif TC","PMingLiU","Microsoft JhengHei",serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;position:fixed;inset:0}
  #hud{position:fixed;top:12px;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 1px 6px #000}
  #hud b{display:block;font-weight:400;font-size:15px;letter-spacing:.35em;opacity:.9}
  #hud span{font-size:14px;letter-spacing:.15em;opacity:.8}
  #hint{position:fixed;bottom:128px;left:0;right:0;text-align:center;font-size:13px;opacity:0;transition:opacity 1.2s;pointer-events:none;letter-spacing:.1em;text-shadow:0 1px 4px #000}
  #bubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%);max-width:min(70vw,300px);padding:10px 16px;border-radius:16px;background:rgba(255,248,236,.97);color:#4a3a30;font-size:17px;line-height:1.6;text-align:center;opacity:0;transition:opacity .5s;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.35)}

  #bubble.show{opacity:1}
  #bar{position:fixed;left:0;right:0;bottom:12px;display:flex;flex-direction:column;gap:7px;align-items:center;padding:0 10px}
  .row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;width:100%}
  .lab{font-size:13px;opacity:.75;align-self:center;letter-spacing:.1em;text-shadow:0 1px 4px #000}
  .in{border-color:#ffb7c9;color:#ffd6e0;background:rgba(88,38,64,.66)}
  .in:hover,.in.on{background:rgba(255,183,201,.3)}
  button{font:inherit;padding:8px 15px;border-radius:26px;border:1px solid #ffd88a;background:rgba(36,31,58,.74);color:#ffd88a;font-size:15px;cursor:pointer;letter-spacing:.06em;backdrop-filter:blur(4px)}
  button:hover,button.on{background:rgba(255,216,138,.25)}
  #call{background:rgba(255,183,201,.22);border-color:#ffb7c9;color:#ffd6e0}
  .sys{border-color:#9fb6ff;color:#c9d6ff}
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(20,16,40,.9);text-align:center;padding:24px;animation:f 1.2s}
  #intro.hide{display:none}
  #intro img{width:clamp(120px,24vh,200px);aspect-ratio:4/5;object-fit:cover;object-position:center 20%;border-radius:50%;border:3px solid #ffd88a;box-shadow:0 0 50px rgba(255,216,138,.55)}
  #intro h1{font-weight:400;font-size:32px;letter-spacing:.3em;color:#ffd88a}
  #intro p{font-size:19px;line-height:1.9;max-width:480px}
  #loading{font-size:14px;opacity:.6;min-height:1.2em}
  #kbubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%);max-width:min(60vw,240px);padding:8px 14px;border-radius:16px;background:rgba(226,240,255,.97);color:#2c3e55;font-size:16px;line-height:1.5;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.3)}
  #kbubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:rgba(226,240,255,.97)}
  #kbubble.show{opacity:1}
  #chat{position:fixed;left:50%;bottom:148px;transform:translateX(-50%);display:none;flex-direction:column;gap:6px;align-items:center}

  #chat button{border-color:#a9c8ff;color:#dbe8ff;background:rgba(30,44,82,.8)}

  #fade{position:fixed;inset:0;background:#05060f;opacity:0;pointer-events:none;transition:opacity 1.6s;display:flex;align-items:center;justify-content:center;font-size:26px;letter-spacing:.3em;color:#cfd8ff}

  #answer{background:rgba(80,200,120,.3);border-color:#7de0a0;color:#c8ffd8;padding:10px 26px}
  #decline{background:rgba(220,90,90,.22);border-color:#e08a8a;color:#ffd0d0}

  #fbubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%);max-width:min(60vw,260px);padding:8px 14px;border-radius:14px;background:rgba(226,248,226,.97);color:#2c4a30;font-size:16px;line-height:1.5;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}

  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s;z-index:12}

  #polaroid{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,30,.72);z-index:11}

  #polCap{color:#5a4a3a;font-size:19px;letter-spacing:.12em;margin:12px 0 10px}
  @keyframes pop{from{transform:rotate(-8deg) scale(.7);opacity:0}to{transform:rotate(-2deg) scale(1);opacity:1}}
  @keyframes f{from{opacity:0}to{opacity:1}}
  @media (max-width:560px){button{padding:7px 11px;font-size:14px}#bar{gap:5px}}
</style>

<script>
/* ========== 這裡可以改成你自己的話 ========== */

// 自動進行的順序；day=只在白天、night=只在傍晚到夜晚
const ROUTINE = [   // h=[從幾點, 到幾點] 這件事才會做
  {n:"cook",h:[6,21]},{n:"eat",h:[6,21]},{n:"wash",h:[6,18]},{n:"hang",h:[6,18]},{n:"fold",h:[6,22]},

const DUR = {cook:15, eat:15, wash:10, hang:15, fold:13, water:12, clean:17, tv:18, call:9};  // 每件事做幾秒
const DAY_SECONDS = 420;   // 遊戲裡一整天等於現實幾秒
const START_HOUR = 9;      // 從幾點開始
// 你和媽媽的互動：聊天時你可以選的話，以及媽媽的回答（heart:true 會冒出愛心）
const CHAT = [
  {ask:"今天好累啊。",   reply:["辛苦了，坐下來歇一歇，媽媽幫你捏捏肩。","累了就回家，家裡永遠有你的位子。"]},

function valid(r){if(!r.h)return true;const a=r.h[0],b=r.h[1];return a<=b?(hour>=a&&hour<b):(hour>=a||hour<b)}
function next(){let r,n=0;do{r=ROUTINE[routineIdx%ROUTINE.length];routineIdx++;n++}while(!valid(r)&&n<20);start(r.n)}

function enterDo(){
  const st=ST[cur.name],kn=kindOf(cur.name);cur.phase='do';cur.t=0;faceYaw=st.face;
  if(cur.name==='clean')wi=0;
  if(kn==='cook')food.visible=false;

  if(kn==='eat')food.visible=true;
  if(kn==='tv')tvOn=true;
  if(kn==='fold')folded.forEach(g=>g.userData.show=false);
  if(inter&&inter.name===cur.name)inter.go=true;
  if(cur.name==='call')say(linesFor('call')[0],5);else if(cur.name==='chat')say('怎麼了？跟媽媽說說。',4.5);else if(cur.name!=='phone'&&cur.name!=='sleep'&&cur.name!=='bday'&&cur.name!=='redenv')sayRand(cur.name);
  if(cur.name==='sleep')cur.nap=(hour>=6&&hour<18);
  lineTimer=0;heartT=0;
}

  const kn=kindOf(cur.name);loc=cur.name;
  if(kn==='cook')food.visible=true;if(kn==='eat')food.visible=false;if(kn==='tv')tvOn=false;
  if(inter&&inter.name===cur.name)endInter();

function updateBehavior(dt,t){

  switch(cur.phase){
    case 'rise': if(sitW<.12&&lieW<.12)cur.phase='walk';break;
    case 'walk':{
      if(cur.pi>=cur.path.length){
        if(IN[cur.name]){if(!inter){cur.phase='rest';cur.t=0;break}inter.momAt=true;cur.phase='await';cur.t=0;faceYaw=st.face;break}
        enterDo();break}
      if(walkTo(cur.path[cur.pi],1.55,dt))cur.pi++;break}
    case 'await':{cur.t+=dt;if(!inter){cur.phase='rest';cur.t=0}else if(inter.kidAt||cur.t>16)enterDo();break}
    case 'do':{
      cur.t+=dt;lineTimer+=dt;
      if(IN[cur.name]){if(!inter){endDoMom();break}if(IN[cur.name].face)faceYaw=Math.atan2(kid.x-mom.position.x,kid.z-mom.position.z)}
      if(cur.name==='clean'){if(walkTo(WANDER[wi%WANDER.length],.75,dt))wi++}
      if(lineTimer>6&&cur.t<cur.dur-3&&cur.name!=='chat'&&cur.name!=='sleep'&&cur.name!=='phone'&&cur.name!=='bday'&&cur.name!=='redenv'){lineTimer=0;sayRand(cur.name)}
      if(cur.name==='hang'){const n=Math.min(6,Math.floor(cur.t/(cur.dur*.8)*6)+1);clothes.forEach((c,i)=>c.userData.show=i<n)}
      if(cur.name==='fold'){const n=Math.min(4,Math.floor(cur.t/(cur.dur*.8)*4)+1);folded.forEach((c,i)=>c.userData.show=i<n)}
      if(doneCond())endDoMom();

    case 'rest': cur.t+=dt;if(cur.t>1.4)next();break;

function famUpdate(c,dt,t){
  if(!c.ch)return;
  const away=parkMode||marketMode||sportMode,role=famRole(c);
  if(!away){c.group.visible=!(hour>=21.5||hour<6.5)}else c.group.visible=true;
  c.look=!!role.look;c.jog=!!role.jog;c.mode=role.mode;
  const sitK=role.sit?1:0,groundK=role.sit==='ground'?1:0;
  const dx=role.x-c.x,dz=role.z-c.z,d=Math.hypot(dx,dz);c.moved=0;
  if(!c.init||d>8){c.x=role.x;c.z=role.z;c.init=true;c.faceYaw=role.face;c.yaw=role.face}
  else if(d>.12){const sp=Math.min(2.6,Math.max(.7,d*1.6)),s=Math.min(d,sp*dt);c.x+=dx/d*s;c.z+=dz/d*s;c.faceYaw=Math.atan2(dx,dz);c.moved=s/dt}
  else c.faceYaw=role.face;
  c.yaw+=wrap(c.faceYaw-c.yaw)*Math.min(1,dt*7);
  c.sitW+=(sitK-c.sitW)*Math.min(1,dt*3);c.groundW+=(groundK-c.groundW)*Math.min(1,dt*3);
  c.walkAmp+=(Math.min(1,c.moved/1.55)-c.walkAmp)*Math.min(1,dt*7);c.walkPh+=dt*3.9*Math.max(c.moved,0);
  c.sit=c.sitW>.3?(c.groundW>.5?'ground':'chair'):null;
  const T=famPose(c,t),bounce=T._bounce||0;delete T._bounce;
  const keys=new Set([...Object.keys(c.pose),...Object.keys(T)]),k=Math.min(1,dt*9);
  keys.forEach(n=>{const a=c.pose[n]||(c.pose[n]=[0,0,0]),g=T[n]||[0,0,0];for(let i=0;i<3;i++)a[i]+=(g[i]-a[i])*k});
  applyRig(c.ch,c.pose);
  c.group.position.set(c.x,0,c.z);c.pivot.rotation.y=c.yaw;
  c.pivot.position.y=-(c.dChair*(1-c.groundW)+c.dGround*c.groundW)*c.sitW*(c.sitK||1)+Math.abs(Math.sin(c.walkPh))*.03*c.walkAmp+bounce;
}

const FAMBY={gd:GD,sil:SIL,lin:LIN};
const PLAYNAME={me:'寶貝',gd:'孫女',sil:'女婿',lin:'阿姨'};
let playKey='me';
function tipOf(ch,side){const k='_tip'+side;if(!ch[k]){const o=new THREE.Object3D();ch.bones['mixamorig'+side+'Hand'].add(o);ch[k]=o}return ch[k]}
function swapWith(key){
  const c=FAMBY[key];if(!c||!c.ch||!kidRig)return false;
  const a=kidRig,b=c.ch;
  kp.piv.remove(a.m);c.pivot.remove(b.m);kp.piv.add(b.m);c.pivot.add(a.m);
  kidRig=b;c.ch=a;
  const sp=o=>o.children.find(x=>x.isSprite),s1=sp(kp.piv),s2=sp(c.pivot);
  if(s1&&s2){const m1=s1.material.map;s1.material.map=s2.material.map;s2.material.map=m1;s1.material.needsUpdate=s2.material.needsUpdate=true;const y=s1.position.y;s1.position.y=s2.position.y;s2.position.y=y}
  kp.aR.tip=tipOf(kidRig,'Right');kp.aL.tip=tipOf(kidRig,'Left');
  window.kidSitK=kidRig.scale/1.69;c.sitK=c.ch.scale/CH_DEF[key].scale;
  return true;
}
function playAs(key){
  if(key===playKey)return;
  if(playKey!=='me')swapWith(playKey);
  playKey='me';
  if(key!=='me'&&swapWith(key))playKey=key;
  document.querySelectorAll('[data-play]').forEach(b=>b.classList.toggle('on',b.dataset.play===playKey));

const lookAt=new THREE.Vector3(0,.9,-.3);
let downX=0,downY=0;
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;downX=e.clientX;downY=e.clientY});
addEventListener('pointerup',e=>{drag=false;if(e.target===renderer.domElement&&Math.hypot(e.clientX-downX,e.clientY-downY)<6)floorClick(e)});
addEventListener('pointermove',e=>{if(!drag)return;tAz=Math.max(-.9,Math.min(.9,tAz-(e.clientX-lx)*.005));tEl=Math.max(.18,Math.min(1.1,tEl+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});
addEventListener('wheel',e=>{tDist=Math.max(6,Math.min(22,tDist+e.deltaY*.01))},{passive:true});
function updateCam(dt){const k=Math.min(1,dt*5);
  if(!camManual&&started){if(parkMode||marketMode||sportMode){lookAt.x+=((mom.position.x+kid.x)/2-lookAt.x)*Math.min(1,dt*2.2);lookAt.z+=((mom.position.z+kid.z)/2-lookAt.z)*Math.min(1,dt*2.2)}else{const fx=Math.max(-.5,Math.min(7.6,(mom.position.x+kid.x)/2));lookAt.x+=(fx-lookAt.x)*Math.min(1,dt*2.2);lookAt.z+=(-.3-lookAt.z)*Math.min(1,dt*2)}}az+=(tAz-az)*k;el+=(tEl-el)*k;dist+=(tDist-dist)*k;
  const asp=innerWidth/innerHeight,d=dist*(asp<1?1.0+(1-asp)*.9:1);
  camera.position.set(lookAt.x+Math.sin(az)*Math.cos(el)*d,lookAt.y+Math.sin(el)*d,lookAt.z+Math.cos(az)*Math.cos(el)*d);camera.lookAt(lookAt)}

// ---------- 聲音：音樂與環境音 ----------
let AC=null,master,musicBus,sfx={},musicOn=true,beat=0,nextT=0;
function initAudio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
  const len=AC.sampleRate*2.4,imp=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=imp.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8)}
  const rev=AC.createConvolver();rev.buffer=imp;const rg=AC.createGain();rg.gain.value=.55;rev.connect(rg);rg.connect(master);
  musicBus=AC.createGain();musicBus.gain.value=.55;musicBus.connect(master);musicBus.connect(rev);
  const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const mk=(f,q,type)=>{const s=AC.createBufferSource();s.buffer=nb;s.loop=true;const fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;const g=AC.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(master);s.start();return g};
  sfx.stove=mk(3800,.7,'bandpass');sfx.water=mk(1100,.4,'lowpass');sfx.tv=mk(520,1.3,'bandpass');sfx.sweep=mk(2600,1,'bandpass');sfx.wash=mk(170,.7,'lowpass');sfx.rain=mk(6500,.5,'highpass');
  nextT=AC.currentTime+.3;setInterval(schedule,120);
}
const SCALE=[261.6,293.7,329.6,392,440,523.3,587.3,659.3,784];
const CHORDS=[[130.8,196,261.6,329.6],[110,164.8,220,261.6],[174.6,261.6,349.2,440],[196,293.7,392,493.9]];
let mi=3;
function tone(f,t0,dur,vol,type='triangle'){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);o.connect(g);g.connect(musicBus);o.start(t0);o.stop(t0+dur+.05)}
function pad(freqs,t0,dur,vol){freqs.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+dur*.35);g.gain.linearRampToValueAtTime(0,t0+dur);o.connect(g);g.connect(musicBus);o.start(t0);o.stop(t0+dur+.05)})}
function schedule(){
  if(!AC||AC.state!=='running')return;
  const night=!isDay(),bpm=night?58:72,step=60/bpm;
  while(nextT<AC.currentTime+.6){
    if(beat%8===0){pad(CHORDS[(beat/8|0)%4].map(f=>night?f:f*1),nextT,step*8.2,night?.05:.045)}
    if(musicOn&&Math.random()<(night?.55:.72)){mi=Math.max(0,Math.min(SCALE.length-1,mi+[-2,-1,-1,0,1,1,2][Math.random()*7|0]));tone(SCALE[mi]*(night?.5:1),nextT,step*(night?3:2.2),night?.09:.075)}
    beat++;nextT+=step;
  }
}
function updateAudio(dt){
  if(!AC)return;const doing=cur.phase==='do',n=cur.name,g=(node,v)=>{node.gain.value+=((musicOn?v:0)-node.gain.value)*Math.min(1,dt*3)};
  musicBus.gain.value+=((musicOn?.55:0)-musicBus.gain.value)*Math.min(1,dt*2);
  g(sfx.stove,doing&&n==='cook'?.03:0);g(sfx.water,(doing&&(n==='water'||n==='water2'||n==='dish')||showerOn)?.03:0);g(sfx.tv,(tvOn||marketMode||sportMode)?.022:0);g(sfx.rain,rainW>.05?.05*rainW:0);
  g(sfx.sweep,doing&&n==='clean'?.012*(.5+.5*Math.abs(Math.sin(performance.now()/330))):0);g(sfx.wash,doing&&n==='wash'&&cur.t>cur.dur*.4?.04:0);
}
$('musicBtn').onclick=()=>{musicOn=!musicOn;$('musicBtn').textContent=musicOn?'音樂 開':'音樂 關';if(AC&&AC.state==='suspended')AC.resume()};

let started=false;
$('start').onclick=()=>{$('intro').classList.add('hide');started=true;initAudio();if(AC&&AC.state==='suspended')AC.resume();begin();
  setTimeout(()=>{ksay('我回來了。',3);setTimeout(()=>say('你回來啦，洗洗手，馬上吃飯。',5),1800)},900);
  $('hint').style.opacity=.8;setTimeout(()=>$('hint').style.opacity=0,7000)};
const clock=new THREE.Clock();
let _lf=0;function loop(){requestAnimationFrame(loop);if(LOWQ){const _n=performance.now();if(_n-_lf<30)return;_lf=_n}const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  const ts=(cur.name==='sleep'&&cur.phase==='do'&&!cur.nap)?6:1;hour=(hour+dt*24/DAY_SECONDS*ts)%24;applyTime(hour);
  if(started&&momReady){if(parkMode)parkUpdate(dt,t);else if(marketMode)marketUpdate(dt,t);else if(sportMode)sportUpdate(dt,t);else updateBehavior(dt,t)}
  if(started)updateKid(dt,t);
  updatePose(dt,t);kidApply(dt,t);updateFx(dt,t);kidFx(dt,t);wingFx(dt,t);updateDog(dt,t);dogApply(dt,t);phoneTick(dt);festivalTick(dt,t);helpFx(dt,t);parkFx(dt,t);updateAudio(dt);updateCam(dt);renderer.render(scene,camera);if(snapReq){snapReq=false;try{showPolaroid(renderer.domElement.toDataURL('image/jpeg',.92))}catch(e){console.error(e)}}}
loop();
